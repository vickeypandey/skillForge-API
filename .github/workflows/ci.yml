name: CI

on:
  push:
  pull_request:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: skillforge_db
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: skillforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: skillforge/pom.xml
      - name: Set ephemeral test signing key
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Run tests
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/skillforge_db
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: ./mvnw -B test
      - name: Package application
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/skillforge_db
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: ./mvnw -B -DskipTests package
